name: F1 OS 1.6.2 Windows QA

on:
  push:
    branches: [feat/f1-os-single-control-plane]
    paths:
      - 'qa/f1_os_162/**'
      - '.github/workflows/f1-os-162-windows-qa.yml'
  workflow_dispatch:

jobs:
  windows-task-qa:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dummy F1 OS install
        shell: powershell
        run: |
          $dest = Join-Path $env:LOCALAPPDATA 'F1_OS_Immobiliare'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          @'
          import os, sys
          from pathlib import Path
          p=Path(os.environ['APPDATA'])/'F1_OS_Immobiliare'/'task_probe.txt'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('ARGS='+'|'.join(sys.argv[1:]),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 (Join-Path $dest 'F1_OS_Immobiliare.pyw')

      - name: Register 01:00 task with absolute Python
        shell: powershell
        run: |
          $dest = Join-Path $env:LOCALAPPDATA 'F1_OS_Immobiliare'
          $python=(Get-Command python.exe -ErrorAction Stop).Source
          $app=Join-Path $dest 'F1_OS_Immobiliare.pyw'
          & '.\qa\f1_os_162\INSTALLA_TASK_01.ps1' -PythonExe $python -AppPath $app
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify trigger action and recovery settings
        shell: powershell
        run: |
          $name='F1 OS Immobiliare - Flusso 01'
          $task=Get-ScheduledTask -TaskName $name -ErrorAction Stop
          if (-not $task.Settings.StartWhenAvailable) { throw 'StartWhenAvailable FALSE' }
          if (-not $task.Settings.WakeToRun) { throw 'WakeToRun FALSE' }
          $daily=$task.Triggers | Where-Object { $_.CimClass.CimClassName -eq 'MSFT_TaskDailyTrigger' } | Select-Object -First 1
          if (-not $daily) { throw 'Trigger daily assente' }
          $start=[datetime]$daily.StartBoundary
          if ($start.Hour -ne 1 -or $start.Minute -ne 0) { throw "Orario errato: $($daily.StartBoundary)" }
          $action=$task.Actions | Select-Object -First 1
          if ($action.Execute -ne $env:PYTHON) { throw "Eseguibile errato: $($action.Execute) != $env:PYTHON" }
          if ($action.Arguments -notmatch '--daily-flow') { throw "Argomento mancante: $($action.Arguments)" }
          Write-Host "PASS trigger 01:00; StartWhenAvailable=$($task.Settings.StartWhenAvailable); WakeToRun=$($task.Settings.WakeToRun); Execute=$($action.Execute)"

      - name: Execute task now and verify --daily-flow
        shell: powershell
        run: |
          $name='F1 OS Immobiliare - Flusso 01'
          $probe=Join-Path $env:APPDATA 'F1_OS_Immobiliare\task_probe.txt'
          Remove-Item $probe -Force -ErrorAction SilentlyContinue
          Start-ScheduledTask -TaskName $name
          $ok=$false
          for($i=0;$i -lt 30;$i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $probe) { $ok=$true; break }
          }
          if (-not $ok) {
            $info=Get-ScheduledTaskInfo -TaskName $name
            $task=Get-ScheduledTask -TaskName $name
            Write-Host "State=$($task.State) LastTaskResult=$($info.LastTaskResult) LastRunTime=$($info.LastRunTime)"
            throw 'Il task non ha eseguito F1 OS --daily-flow'
          }
          $text=Get-Content $probe -Raw
          if ($text -notmatch '--daily-flow') { throw "Argomento --daily-flow assente: $text" }
          Write-Host "PASS task eseguito: $text"

      - name: Cleanup task
        if: always()
        shell: powershell
        run: Unregister-ScheduledTask -TaskName 'F1 OS Immobiliare - Flusso 01' -Confirm:$false -ErrorAction SilentlyContinue
