name: F1 Giro Master QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "seller_radar_auto/build_municipality_matrix.py"
      - "seller_radar_auto/sanitize_operational_queue.py"
      - "seller_radar_auto/prepare_acquisition_route.py"
      - "seller_radar_auto/refresh_dashboard.py"
      - "seller_radar_auto/validate_giro_acquisizione.py"
      - "seller_radar_auto/municipalities.csv"
      - "seller_radar_auto/f1_microzone_config.json"
      - "seller_radar_auto/data/state.json"
      - "seller_radar_auto/data/work_queue.csv"
      - ".github/workflows/f1-seller-radar-auto.yml"
      - ".github/workflows/f1-giro-pr-gate.yml"
  pull_request:
    paths:
      - "seller_radar_auto/build_municipality_matrix.py"
      - "seller_radar_auto/sanitize_operational_queue.py"
      - "seller_radar_auto/prepare_acquisition_route.py"
      - "seller_radar_auto/refresh_dashboard.py"
      - "seller_radar_auto/validate_giro_acquisizione.py"
      - "seller_radar_auto/municipalities.csv"
      - "seller_radar_auto/f1_microzone_config.json"
      - "seller_radar_auto/data/state.json"
      - "seller_radar_auto/data/work_queue.csv"
      - ".github/workflows/f1-seller-radar-auto.yml"
      - ".github/workflows/f1-giro-acquisizione-qa.yml"
      - ".github/workflows/f1-giro-pr-gate.yml"

permissions:
  contents: read

jobs:
  giro-master-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python
        run: |
          python -m py_compile \
            seller_radar_auto/build_municipality_matrix.py \
            seller_radar_auto/sanitize_operational_queue.py \
            seller_radar_auto/prepare_acquisition_route.py \
            seller_radar_auto/refresh_dashboard.py \
            seller_radar_auto/validate_giro_acquisizione.py

      - name: Verifica discovery MASTER Villar Dora radiale
        shell: bash
        run: |
          MATRIX=$(python seller_radar_auto/build_municipality_matrix.py)
          python - "$MATRIX" <<'PY'
          import csv, json, sys
          from pathlib import Path
          matrix = json.loads(sys.argv[1])["comune"]
          with Path("seller_radar_auto/municipalities.csv").open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          enabled = [r for r in rows if r.get("enabled") == "1"]
          expected = [r["comune"].strip() for r in enabled]
          assert matrix and matrix[0].casefold() == "villar dora", matrix[:1]
          assert matrix == expected, {"matrix": matrix, "expected": expected}
          centers=[r for r in enabled if r.get('side')=='CENTRO']
          assert len(centers)==1 and centers[0]['comune']=='Villar Dora', centers
          assert all(r.get('side') in {'CENTRO','SINISTRA','DESTRA'} for r in enabled)
          assert "Sant'Ambrogio di Torino" in expected
          print(f"PASS MATRIX MASTER VILLAR DORA | comuni={len(matrix)} | centro={matrix[0]}")
          PY

      - name: Verifica che il sanitizer non tagli per geografia
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, sys
          from pathlib import Path
          sys.path.insert(0, "seller_radar_auto")
          import sanitize_operational_queue as s
          q = Path("seller_radar_auto/data/work_queue.csv")
          m = Path("seller_radar_auto/municipalities.csv")
          with m.open(encoding="utf-8-sig", newline="") as f:
              active = {(r.get("comune") or "").strip().casefold() for r in csv.DictReader(f) if r.get("enabled") == "1"}
          with q.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          protected = sorted({(r.get("URL") or "").strip() for r in rows if (r.get("COMUNE") or "").strip().casefold() not in active and not s.reason(r) and (r.get("URL") or "").strip()})
          Path("/tmp/outside_keepable.json").write_text(json.dumps(protected), encoding="utf-8")
          print(f"SELLER FUORI TERRITORIO DA PRESERVARE={len(protected)}")
          PY
          python seller_radar_auto/sanitize_operational_queue.py
          python - <<'PY'
          import csv, json
          from pathlib import Path
          protected = set(json.loads(Path("/tmp/outside_keepable.json").read_text(encoding="utf-8")))
          with Path("seller_radar_auto/data/work_queue.csv").open(encoding="utf-8-sig", newline="") as f:
              remaining = {(r.get("URL") or "").strip() for r in csv.DictReader(f)}
          missing = protected - remaining
          assert not missing, f"Sanitizer ha eliminato {len(missing)} seller validi solo perché fuori territorio"
          print(f"PASS SANITIZER MASTER | fuori_territorio_preservati={len(protected)}")
          PY

      - name: Rigenera e valida Giro sulla sequenza reale
        run: |
          python seller_radar_auto/prepare_acquisition_route.py
          python seller_radar_auto/validate_giro_acquisizione.py

      - name: Verifica dashboard MASTER e operativo
        shell: bash
        run: |
          python seller_radar_auto/refresh_dashboard.py
          grep -q "F1 SELLER RADAR · MASTER COMPLETO" seller_radar_auto/dashboard.html
          grep -q "NEL TERRITORIO ATTIVO" seller_radar_auto/dashboard.html
          grep -q "FERMATE PRONTE" seller_radar_auto/dashboard.html
          grep -q "INDIRIZZO DA VERIFICARE" seller_radar_auto/dashboard.html
          grep -q "BACKLOG FUORI TERRITORIO" seller_radar_auto/dashboard.html
          grep -q "TERRITORI OPERATIVI" seller_radar_auto/dashboard.html
          echo "PASS DASHBOARD MASTER + GIRO VILLAR DORA"
