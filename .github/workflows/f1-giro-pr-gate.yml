name: F1 Giro Territory QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "seller_radar_auto/prepare_acquisition_route.py"
      - "seller_radar_auto/sanitize_operational_queue.py"
      - "seller_radar_auto/refresh_dashboard.py"
      - "seller_radar_auto/build_municipality_matrix.py"
      - "seller_radar_auto/validate_giro_acquisizione.py"
      - "seller_radar_auto/municipalities.csv"
      - ".github/workflows/f1-giro-pr-gate.yml"
  pull_request:
    paths:
      - "seller_radar_auto/prepare_acquisition_route.py"
      - "seller_radar_auto/sanitize_operational_queue.py"
      - "seller_radar_auto/refresh_dashboard.py"
      - "seller_radar_auto/build_municipality_matrix.py"
      - "seller_radar_auto/validate_giro_acquisizione.py"
      - "seller_radar_auto/municipalities.csv"
      - "seller_radar_auto/data/state.json"
      - "seller_radar_auto/data/work_queue.csv"
      - ".github/workflows/f1-seller-radar-auto.yml"
      - ".github/workflows/f1-giro-pr-gate.yml"

permissions:
  contents: read

jobs:
  giro-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python
        run: |
          python -m py_compile \
            seller_radar_auto/build_municipality_matrix.py \
            seller_radar_auto/sanitize_operational_queue.py \
            seller_radar_auto/prepare_acquisition_route.py \
            seller_radar_auto/refresh_dashboard.py \
            seller_radar_auto/validate_giro_acquisizione.py

      - name: Verifica discovery territorio attivo
        shell: bash
        run: |
          MATRIX=$(python seller_radar_auto/build_municipality_matrix.py)
          python - "$MATRIX" <<'PY'
          import csv, json, sys
          from pathlib import Path
          matrix = json.loads(sys.argv[1])["comune"]
          with Path("seller_radar_auto/municipalities.csv").open(encoding="utf-8-sig", newline="") as f:
              enabled = [r["comune"].strip() for r in csv.DictReader(f) if r.get("enabled") == "1" and r.get("comune", "").strip()]
          expected = {c.casefold() for c in enabled}
          assert matrix and matrix[0].casefold() == "susa"
          assert {c.casefold() for c in matrix} == expected
          assert len(matrix) == len(expected)
          print(f"PASS MATRIX TERRITORIO | comuni_attivi={len(matrix)} | centro={matrix[0]}")
          PY

      - name: Filtra, rigenera e valida Giro
        run: |
          python seller_radar_auto/sanitize_operational_queue.py
          python seller_radar_auto/prepare_acquisition_route.py
          python seller_radar_auto/validate_giro_acquisizione.py

      - name: Verifica dashboard operativo
        shell: bash
        run: |
          python seller_radar_auto/refresh_dashboard.py
          grep -q "F1 SELLER RADAR" seller_radar_auto/dashboard.html
          grep -q "Territori" seller_radar_auto/dashboard.html
          python - <<'PY'
          import csv
          from pathlib import Path
          allowed = set()
          with Path('seller_radar_auto/municipalities.csv').open(encoding='utf-8-sig', newline='') as f:
              for r in csv.DictReader(f):
                  if r.get('enabled') == '1':
                      allowed.add((r.get('comune') or '').strip().casefold())
          with Path('seller_radar_auto/data/work_queue.csv').open(encoding='utf-8-sig', newline='') as f:
              towns = {(r.get('COMUNE') or '').strip().casefold() for r in csv.DictReader(f) if (r.get('COMUNE') or '').strip()}
          outside = sorted(towns - allowed)
          assert not outside, f"Dashboard queue fuori territorio: {outside}"
          print(f"PASS DASHBOARD TERRITORIO | comuni={len(towns)}")
          PY
