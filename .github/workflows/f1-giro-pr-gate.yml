name: F1 Giro PR Gate

on:
  pull_request:
    paths:
      - "seller_radar_auto/prepare_acquisition_route.py"
      - "seller_radar_auto/refresh_dashboard.py"
      - "seller_radar_auto/build_municipality_matrix.py"
      - "seller_radar_auto/validate_giro_acquisizione.py"
      - "seller_radar_auto/municipalities.csv"
      - "seller_radar_auto/data/state.json"
      - "seller_radar_auto/data/work_queue.csv"
      - ".github/workflows/f1-seller-radar-auto.yml"
      - ".github/workflows/f1-giro-acquisizione-qa.yml"
      - ".github/workflows/f1-giro-pr-gate.yml"

permissions:
  contents: read

jobs:
  giro-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python
        run: |
          python -m py_compile \
            seller_radar_auto/build_municipality_matrix.py \
            seller_radar_auto/prepare_acquisition_route.py \
            seller_radar_auto/refresh_dashboard.py \
            seller_radar_auto/validate_giro_acquisizione.py

      - name: Verifica discovery MASTER
        shell: bash
        run: |
          MATRIX=$(python seller_radar_auto/build_municipality_matrix.py)
          python - "$MATRIX" <<'PY'
          import csv, json, sys
          from pathlib import Path
          matrix = json.loads(sys.argv[1])["comune"]
          with Path("seller_radar_auto/municipalities.csv").open(encoding="utf-8-sig", newline="") as f:
              catalog = [r["comune"].strip() for r in csv.DictReader(f) if r.get("comune", "").strip()]
          expected = {c.casefold() for c in catalog}
          assert matrix and matrix[0].casefold() == "susa"
          assert {c.casefold() for c in matrix} == expected
          assert len(matrix) == len(expected)
          print(f"PASS MATRIX MASTER | comuni={len(matrix)}")
          PY

      - name: Rigenera e valida Giro
        run: |
          python seller_radar_auto/prepare_acquisition_route.py
          python seller_radar_auto/validate_giro_acquisizione.py

      - name: Verifica dashboard
        shell: bash
        run: |
          python seller_radar_auto/refresh_dashboard.py
          grep -q "SELLER MASTER TOTALI" seller_radar_auto/dashboard.html
          grep -q "FERMATE PRONTE" seller_radar_auto/dashboard.html
          grep -q "BACKLOG FUORI TERRITORIO" seller_radar_auto/dashboard.html
          grep -q "MASTER completo + filtro operativo Susa 20 km" seller_radar_auto/dashboard.html
          echo "PASS DASHBOARD GIRO"
