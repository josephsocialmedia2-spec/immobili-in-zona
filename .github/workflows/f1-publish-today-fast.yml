name: F1 Publish Today Fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f1-publish-today-fast.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: f1-publish-today-fast
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout fixed code
        uses: actions/checkout@v4

      - name: Recover today runtime and worker results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/radar-runtime seller_radar_auto/item_results
          mkdir -p /tmp/radar-runtime seller_radar_auto/item_results
          gh run download 34191623887 --repo "${{ github.repository }}" --name radar-runtime --dir /tmp/radar-runtime
          rm -rf seller_radar_auto/data
          cp -a /tmp/radar-runtime/data seller_radar_auto/data
          for f in dashboard.html intelligence_dashboard.html integrations.json; do
            if [ -e "/tmp/radar-runtime/$f" ]; then cp -a "/tmp/radar-runtime/$f" "seller_radar_auto/$f"; fi
          done
          gh run download 34191623887 --repo "${{ github.repository }}" --pattern 'item-*' --dir seller_radar_auto/item_results

      - name: Build current operational files
        shell: bash
        run: |
          set -euo pipefail
          python seller_radar_auto/merge_item_results.py
          python seller_radar_auto/apply_market_enrichment.py
          python seller_radar_auto/sanitize_operational_queue.py
          python seller_radar_auto/prepare_acquisition_route.py
          python seller_radar_auto/validate_giro_acquisizione.py
          python seller_radar_auto/refresh_dashboard.py
          python - <<'PY'
          import csv
          from pathlib import Path
          d=Path('seller_radar_auto/data')
          with (d/'work_queue.csv').open(encoding='utf-8-sig',newline='') as f: q=list(csv.DictReader(f))
          with (d/'giro_acquisizione_oggi.csv').open(encoding='utf-8-sig',newline='') as f: g=list(csv.DictReader(f))
          assert q and g
          print(f'PASS FAST TODAY | work_queue={len(q)} giro_oggi={len(g)}')
          PY

      - name: Publish now
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'f1-seller-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A seller_radar_auto/data seller_radar_auto/dashboard.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'radar: publish current 2026-09-08 results'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
