name: F1 Market Hub AFTER RADAR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "seller_radar_auto/cross_repo_sources.json"
      - "seller_radar_auto/cross_repo_ingest.py"
      - "seller_radar_auto/appointment_brief.py"
      - "seller_radar_auto/apply_market_enrichment.py"
      - "seller_radar_auto/item_worker.py"
      - "seller_radar_auto/search_market_fallback.py"
      - "seller_radar_auto/market_intelligence_v2.py"
  workflow_run:
    workflows: ["F1 Seller Radar AUTO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: f1-market-hub-after-radar
  cancel-in-progress: false

jobs:
  build-hub:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verifica script
        run: python -m py_compile seller_radar_auto/cross_repo_ingest.py seller_radar_auto/appointment_brief.py seller_radar_auto/apply_market_enrichment.py seller_radar_auto/market_intelligence.py seller_radar_auto/market_intelligence_v2.py seller_radar_auto/item_worker.py seller_radar_auto/search_market_fallback.py

      - name: Applica prezzi e inserzionisti verificati
        run: python seller_radar_auto/apply_market_enrichment.py

      - name: Rigenera Market Intelligence e KPI filtrati
        run: python seller_radar_auto/market_intelligence_v2.py

      - name: Collega repository F1
        run: python seller_radar_auto/cross_repo_ingest.py

      - name: Genera Brief Appuntamento F1
        run: python seller_radar_auto/appointment_brief.py

      - name: Salva quadro generale
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "f1-market-hub-bot"
          git config user.email "actions@users.noreply.github.com"

          SNAPSHOT_DIR="$(mktemp -d)"
          mkdir -p "$SNAPSHOT_DIR/seller_radar_auto/data"
          cp -a seller_radar_auto/data/state.json "$SNAPSHOT_DIR/seller_radar_auto/data/state.json"
          cp -a seller_radar_auto/data/intelligence "$SNAPSHOT_DIR/seller_radar_auto/data/intelligence"
          cp -a seller_radar_auto/intelligence_dashboard.html "$SNAPSHOT_DIR/seller_radar_auto/intelligence_dashboard.html"
          cp -a seller_radar_auto/appointment_brief.html "$SNAPSHOT_DIR/seller_radar_auto/appointment_brief.html"

          restore_outputs() {
            mkdir -p seller_radar_auto/data
            cp -a "$SNAPSHOT_DIR/seller_radar_auto/data/state.json" seller_radar_auto/data/state.json
            rm -rf seller_radar_auto/data/intelligence
            cp -a "$SNAPSHOT_DIR/seller_radar_auto/data/intelligence" seller_radar_auto/data/intelligence
            cp -a "$SNAPSHOT_DIR/seller_radar_auto/intelligence_dashboard.html" seller_radar_auto/intelligence_dashboard.html
            cp -a "$SNAPSHOT_DIR/seller_radar_auto/appointment_brief.html" seller_radar_auto/appointment_brief.html
          }

          for attempt in 1 2 3; do
            echo "Persist Market Hub tentativo $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            restore_outputs
            git add -A seller_radar_auto/data/state.json seller_radar_auto/data/intelligence seller_radar_auto/intelligence_dashboard.html seller_radar_auto/appointment_brief.html
            if git diff --cached --quiet; then
              echo "Nessun aggiornamento del Market Hub."
              exit 0
            fi
            git commit -m "market-hub: aggiorna prezzi, agenzie e brief"
            if git push origin HEAD:main; then
              echo "Market Hub persist completato."
              exit 0
            fi
            echo "Push concorrente rilevato: riallineo main e riapplico il quadro generale."
            sleep $((attempt * 2))
          done

          echo "Persist Market Hub fallito dopo 3 tentativi."
          exit 1
