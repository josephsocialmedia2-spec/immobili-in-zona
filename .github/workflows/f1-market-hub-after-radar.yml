name: F1 Market Hub AFTER RADAR

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["F1 Seller Radar AUTO"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: f1-market-hub-after-radar
  cancel-in-progress: true

jobs:
  build-hub:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verifica script
        run: python -m py_compile seller_radar_auto/cross_repo_ingest.py seller_radar_auto/appointment_brief.py

      - name: Collega repository F1
        run: python seller_radar_auto/cross_repo_ingest.py

      - name: Genera Brief Appuntamento F1
        run: python seller_radar_auto/appointment_brief.py

      - name: Salva quadro generale
        shell: bash
        run: |
          git config user.name "f1-market-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seller_radar_auto/data/intelligence/external_records.csv \
                  seller_radar_auto/data/intelligence/repo_status.csv \
                  seller_radar_auto/data/intelligence/repo_status.json \
                  seller_radar_auto/appointment_brief.html
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento del Market Hub."
          else
            git commit -m "market-hub: aggiorna brief e repository collegati"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
