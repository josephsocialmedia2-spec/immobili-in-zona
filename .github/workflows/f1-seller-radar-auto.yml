name: F1 Seller Radar AUTO

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22,23 * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build discovery matrix
        run: python seller_radar_auto/build_discovery_matrix.py
      - name: Public discovery
        run: python seller_radar_auto/radar_discovery.py
      - name: Prepare acquisition route
        run: python seller_radar_auto/prepare_acquisition_route.py
      - name: Validate
        run: python seller_radar_auto/validate_giro_acquisizione.py
      - name: Commit generated data
        run: |
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git add seller_radar_auto/data
          git diff --cached --quiet || git commit -m "seller radar: refresh automatico"
          git push
