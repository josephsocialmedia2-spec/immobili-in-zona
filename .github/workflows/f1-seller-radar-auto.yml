name: F1 Seller Radar AUTO

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22,23 * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build operational territory 20 km
        run: python seller_radar_auto/build_operational_territory.py

      - name: Build discovery matrix including localities
        run: python seller_radar_auto/build_discovery_matrix.py

      - name: Discover agency inventories first
        run: python seller_radar_auto/agency_inventory_discovery.py

      - name: Discover portals private and social
        run: python seller_radar_auto/radar_discovery.py

      - name: Canonical dedupe preserving raw master
        run: python seller_radar_auto/deduplicate_master.py

      - name: Prepare acquisition route
        run: python seller_radar_auto/prepare_acquisition_route.py

      - name: Validate master preservation
        run: python seller_radar_auto/validate_giro_acquisizione.py

      - name: Commit generated data
        run: |
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git add seller_radar_auto/data
          git diff --cached --quiet || git commit -m "seller radar: refresh automatico"
          git pull --rebase origin main
          git push
