name: F1 Seller Radar AUTO

on:
  workflow_dispatch:
  schedule:
    # Due slot UTC: il gate lascia passare solo quello che cade nelle 00 italiane.
    # In questo modo il ciclo parte alle 00:15 Europe/Rome sia con CET sia con CEST.
    - cron: "15 22,23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: f1-seller-radar-auto
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.time_gate.outputs.run }}
      municipality_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica orario italiano 00:15
        id: time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LOCAL_HOUR=$(TZ=Europe/Rome date +%H)
          LOCAL_TIME=$(TZ=Europe/Rome date +%H:%M)
          echo "Ora italiana rilevata: $LOCAL_TIME"
          if [ "$LOCAL_HOUR" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Genera matrix comuni MASTER
        id: matrix
        shell: bash
        run: |
          MATRIX=$(python seller_radar_auto/build_municipality_matrix.py)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  discover:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.gate.outputs.municipality_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discovery ${{ matrix.comune }}
        env:
          F1_COMUNE: ${{ matrix.comune }}
          F1_DISCOVERY_OUT: seller_radar_auto/data/discovery_one.json
          F1_SEARCH_INTERVAL: "3"
        run: python seller_radar_auto/discovery_one.py

      - name: Salva discovery ${{ matrix.comune }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ matrix.comune }}
          path: seller_radar_auto/data/discovery_one.json
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [gate, discover]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      item_matrix: ${{ steps.item_matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica discovery comuni
        uses: actions/download-artifact@v4
        with:
          pattern: discovery-*
          path: seller_radar_auto/discovery_results

      - name: Unisci discovery e lifecycle
        run: python seller_radar_auto/merge_discovery.py

      - name: Scoring, coda e dashboard
        run: python seller_radar_auto/radar_postprocess.py

      - name: Genera matrix annunci
        id: item_matrix
        shell: bash
        run: |
          MATRIX=$(python seller_radar_auto/build_item_matrix.py)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

      - name: Salva runtime radar
        uses: actions/upload-artifact@v4
        with:
          name: radar-runtime
          path: |
            seller_radar_auto/data
            seller_radar_auto/dashboard.html
          if-no-files-found: error
          retention-days: 1

  worker:
    needs: [gate, merge]
    if: needs.gate.outputs.run == 'true' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.merge.outputs.item_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica runtime radar
        uses: actions/download-artifact@v4
        with:
          name: radar-runtime
          path: seller_radar_auto

      - name: Cross-match e Area Radar ${{ matrix.item_id }}
        if: matrix.item_id != '__NONE__'
        env:
          F1_ITEM_ID: ${{ matrix.item_id }}
          F1_ITEM_OUT: seller_radar_auto/data/item_result.json
          F1_SEARCH_INTERVAL: "5"
        run: python seller_radar_auto/item_worker.py

      - name: Fallback Dork prezzo e agenzia ${{ matrix.item_id }}
        if: matrix.item_id != '__NONE__'
        env:
          F1_ITEM_ID: ${{ matrix.item_id }}
          F1_ITEM_OUT: seller_radar_auto/data/item_result.json
          F1_SEARCH_INTERVAL: "4"
        run: python seller_radar_auto/search_market_fallback.py

      - name: Salva risultato annuncio
        if: matrix.item_id != '__NONE__'
        uses: actions/upload-artifact@v4
        with:
          name: item-${{ matrix.item_id }}
          path: seller_radar_auto/data/item_result.json
          if-no-files-found: error
          retention-days: 1

  final:
    needs: [gate, merge, worker]
    if: always() && needs.gate.outputs.run == 'true' && needs.merge.result == 'success' && (needs.worker.result == 'success' || needs.worker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica runtime radar
        uses: actions/download-artifact@v4
        with:
          name: radar-runtime
          path: seller_radar_auto

      - name: Scarica risultati per-annuncio
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: item-*
          path: seller_radar_auto/item_results

      - name: Unisci cross-match e Area Radar
        run: python seller_radar_auto/merge_item_results.py

      - name: Applica prezzi e inserzionisti verificati
        run: python seller_radar_auto/apply_market_enrichment.py

      - name: Quality gate operativo
        run: python seller_radar_auto/sanitize_operational_queue.py

      - name: Prepara giro acquisizione MASTER + Susa 20 km
        run: python seller_radar_auto/prepare_acquisition_route.py

      - name: Verifica integrità Giro acquisizione
        run: python seller_radar_auto/validate_giro_acquisizione.py

      - name: Sincronizza opportunità con F1 Demand Engine
        run: python seller_radar_auto/sync_demand_market.py

      - name: Aggiorna dashboard con F1 Indirizzo Remoto
        run: python seller_radar_auto/refresh_dashboard.py

      - name: Genera Market Intelligence e KPI filtrati
        run: python seller_radar_auto/market_intelligence_v2.py

      - name: Genera microzone per telefonate
        run: python seller_radar_auto/microzone_engine.py

      - name: Invia nuove pubblicazioni via email
        env:
          F1_EMAIL_USER: ${{ secrets.F1_EMAIL_USER }}
          F1_EMAIL_APP_PASSWORD: ${{ secrets.F1_EMAIL_APP_PASSWORD }}
          F1_EMAIL_TO: f1immobiliaresusa@outlook.it
          F1_EMAIL_SMTP_HOST: smtp.gmail.com
          F1_EMAIL_SMTP_PORT: "465"
        run: python seller_radar_auto/email_notify.py

      - name: Invia nuove pubblicazioni su WhatsApp
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_API_VERSION: ${{ secrets.WHATSAPP_API_VERSION }}
          F1_WA_MAIN: ${{ secrets.F1_WA_MAIN }}
          F1_WA_MOUNTAIN: ${{ secrets.F1_WA_MOUNTAIN }}
          F1_WA_TORINO: ${{ secrets.F1_WA_TORINO }}
        run: python seller_radar_auto/whatsapp_notify.py

      - name: Persist public market data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "f1-seller-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          SNAPSHOT_DIR="$(mktemp -d)"
          mkdir -p "$SNAPSHOT_DIR/seller_radar_auto"
          cp -a seller_radar_auto/data "$SNAPSHOT_DIR/seller_radar_auto/data"
          for f in dashboard.html intelligence_dashboard.html integrations.json; do
            if [ -e "seller_radar_auto/$f" ]; then
              cp -a "seller_radar_auto/$f" "$SNAPSHOT_DIR/seller_radar_auto/$f"
            fi
          done

          restore_outputs() {
            rm -rf seller_radar_auto/data
            cp -a "$SNAPSHOT_DIR/seller_radar_auto/data" seller_radar_auto/data
            for f in dashboard.html intelligence_dashboard.html integrations.json; do
              if [ -e "$SNAPSHOT_DIR/seller_radar_auto/$f" ]; then
                cp -a "$SNAPSHOT_DIR/seller_radar_auto/$f" "seller_radar_auto/$f"
              fi
            done
          }

          for attempt in 1 2 3; do
            echo "Persist tentativo $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            restore_outputs
            git add -A seller_radar_auto/data seller_radar_auto/dashboard.html seller_radar_auto/intelligence_dashboard.html seller_radar_auto/integrations.json
            if git diff --cached --quiet; then
              echo "Nessuna modifica da salvare."
              exit 0
            fi
            git commit -m "radar: market intelligence notturna"
            if git push origin HEAD:main; then
              echo "Persist completato."
              exit 0
            fi
            echo "Push concorrente rilevato: riallineo main e riapplico gli output generati."
            sleep $((attempt * 2))
          done

          echo "Persist fallito dopo 3 tentativi."
          exit 1

      - name: Avvia LISTA_MATTINO sul PC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Avvio workflow Windows F1 Telefonate PC"
          gh workflow run f1-telefonate-pc.yml --ref main
