name: F1 Seller Radar AUTO

on:
  workflow_dispatch:
  push:
    paths:
      - "seller_radar_auto/search_engine.py"
      - "seller_radar_auto/ddg_discovery_v2.py"
      - "seller_radar_auto/radar_postprocess.py"
      - "seller_radar_auto/public_enrichment_v2.py"
      - "seller_radar_auto/area_radar.py"
      - "seller_radar_auto/area_radar_selftest.py"
      - "seller_radar_auto/rpo_approved.csv"
      - "seller_radar_auto/municipalities.csv"
      - "seller_radar_auto/portal_catalog.csv"
      - "seller_radar_auto/whatsapp_notify.py"
      - "seller_radar_auto/whatsapp_routes.csv"
      - "seller_radar_auto/email_notify.py"
      - ".github/workflows/f1-seller-radar-auto.yml"
  schedule:
    - cron: "30 6,7,16,17 * * *"

permissions:
  contents: write

concurrency:
  group: f1-seller-radar-auto
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verifica orario italiano
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL_HOUR=$(TZ=Europe/Rome date +%H)
          LOCAL_TIME=$(TZ=Europe/Rome date +%H:%M)
          echo "Ora italiana rilevata: $LOCAL_TIME"

          if [ "$LOCAL_HOUR" = "08" ] || [ "$LOCAL_HOUR" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Self-test Area Radar
        if: steps.gate.outputs.run == 'true'
        run: python seller_radar_auto/area_radar_selftest.py

      - name: Discovery annunci — DuckDuckGo HTML v2
        if: steps.gate.outputs.run == 'true'
        run: python seller_radar_auto/ddg_discovery_v2.py

      - name: Scoring, coda e dashboard
        if: steps.gate.outputs.run == 'true'
        run: python seller_radar_auto/radar_postprocess.py

      - name: Cross-match e ricerca contatti pubblici — v2
        if: steps.gate.outputs.run == 'true'
        env:
          F1_ENRICH_MAX: "35"
          F1_ENRICH_MIN_SCORE: "45"
        run: python seller_radar_auto/public_enrichment_v2.py

      - name: Area Radar — CHIAMA / VAI IN ZONA
        if: steps.gate.outputs.run == 'true'
        run: python seller_radar_auto/area_radar.py

      - name: Invia nuove pubblicazioni via email
        if: steps.gate.outputs.run == 'true'
        env:
          F1_EMAIL_USER: ${{ secrets.F1_EMAIL_USER }}
          F1_EMAIL_APP_PASSWORD: ${{ secrets.F1_EMAIL_APP_PASSWORD }}
          F1_EMAIL_TO: ${{ secrets.F1_EMAIL_TO }}
          F1_EMAIL_SMTP_HOST: smtp.gmail.com
          F1_EMAIL_SMTP_PORT: "465"
        run: python seller_radar_auto/email_notify.py

      - name: Invia nuove pubblicazioni su WhatsApp
        if: steps.gate.outputs.run == 'true'
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_API_VERSION: ${{ secrets.WHATSAPP_API_VERSION }}
          F1_WA_MAIN: ${{ secrets.F1_WA_MAIN }}
          F1_WA_MOUNTAIN: ${{ secrets.F1_WA_MOUNTAIN }}
          F1_WA_TORINO: ${{ secrets.F1_WA_TORINO }}
        run: python seller_radar_auto/whatsapp_notify.py

      - name: Persist public market data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "f1-seller-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A seller_radar_auto/data seller_radar_auto/dashboard.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "radar: aggiornamento automatico"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
