name: F1 Presidio Bisettimanale

on:
  workflow_dispatch:
  push:
    paths:
      - 'seller_radar_auto/.presence_trigger'
      - 'seller_radar_auto/biweekly_presence_plan.py'
  schedule:
    # Due slot UTC; il gate lascia passare solo le 02:xx Europe/Rome.
    - cron: '30 0,1 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: f1-presidio-bisettimanale
  cancel-in-progress: true

jobs:
  presidio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate orario italiano
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          H=$(TZ=Europe/Rome date +%H)
          if [ "$H" = "02" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Genera piano se dovuto
        if: steps.gate.outputs.run == 'true'
        env:
          F1_PRESENCE_FORCE: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: python seller_radar_auto/biweekly_presence_plan.py

      - name: Leggi esito
        if: steps.gate.outputs.run == 'true'
        id: due
        shell: bash
        run: |
          DUE=$(tr -d '\r\n ' < seller_radar_auto/data/presidio_due.txt 2>/dev/null || echo NO)
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "Presidio dovuto: $DUE"

      - name: Aggiorna issue promemoria
        if: steps.gate.outputs.run == 'true' && steps.due.outputs.due == 'YES'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DATE=$(TZ=Europe/Rome date +%d/%m/%Y)
          gh issue edit 7 --repo "${{ github.repository }}" --title "GIRO F1 — presidio bisettimanale — $DATE" --body-file seller_radar_auto/data/presidio_bisettimanale.md

      - name: Salva piano e storico
        if: steps.gate.outputs.run == 'true' && steps.due.outputs.due == 'YES'
        shell: bash
        run: |
          git config user.name "f1-presidio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seller_radar_auto/data/presidio_bisettimanale.csv seller_radar_auto/data/presidio_bisettimanale.md seller_radar_auto/data/presidio_bisettimanale_state.json seller_radar_auto/data/presidio_due.txt seller_radar_auto/presidio_bisettimanale.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "presidio: nuovo giro bisettimanale"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
