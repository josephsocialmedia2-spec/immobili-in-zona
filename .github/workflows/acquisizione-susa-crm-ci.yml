name: Verifica Acquisizione Susa CRM

on:
  push:
    paths:
      - "acquisizione-susa-crm/**"
      - ".github/workflows/acquisizione-susa-crm-ci.yml"
  pull_request:
    paths:
      - "acquisizione-susa-crm/**"
      - ".github/workflows/acquisizione-susa-crm-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acquisizione-susa-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
