name: F1 Telefonate PC

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows_valle_susa/.telefonate_now_trigger'

permissions:
  contents: read

concurrency:
  group: f1-telefonate-pc
  cancel-in-progress: true

jobs:
  telefonate:
    runs-on: [self-hosted, Windows, X64, f1-desktop]
    timeout-minutes: 180
    steps:
      - name: Checkout Radar Valle di Susa
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verifica Python
        shell: powershell
        run: |
          py --version

      - name: Radar -> microzone -> numeri -> LISTA_MATTINO
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows_valle_susa/run_telefonate.ps1

      - name: Stato locale
        if: always()
        shell: powershell
        run: |
          $report = Join-Path $HOME 'Documents\F1_Directory_Microzone\LISTA_MATTINO.html'
          $calls = Join-Path $HOME 'Documents\F1_Directory_Microzone\data\telefonate_mattino.csv'
          $log = Join-Path $HOME 'Documents\F1_Directory_Microzone\motore.log'
          if (Test-Path $report) { Write-Host "RISULTATO: $report" } else { Write-Error 'LISTA_MATTINO.html non trovata.' }
          if (Test-Path $calls) { Write-Host "CSV: $calls" }
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          Write-Host 'Nessun nome o telefono viene caricato come artifact GitHub.'
