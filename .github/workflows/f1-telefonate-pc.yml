name: F1 Telefonate PC

on:
  workflow_run:
    workflows: ["F1 Seller Radar AUTO"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows_valle_susa/telefonate_now_trigger.txt'
      - 'windows_valle_susa/centrale_telefonate_guidate.py'
      - 'windows_valle_susa/f1_mobile_server.py'
      - 'windows_valle_susa/APRI_CENTRALE_PC.bat'
      - 'windows_valle_susa/ensure_centrale_server.ps1'
      - 'windows_valle_susa/run_telefonate.ps1'
      - '.github/workflows/f1-telefonate-pc.yml'

permissions:
  contents: read

concurrency:
  group: f1-telefonate-pc
  cancel-in-progress: true

jobs:
  telefonate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, f1-desktop]
    timeout-minutes: 180
    steps:
      - name: Checkout F1 Susa 20 km
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verifica Python
        shell: powershell
        run: |
          py --version

      - name: Radar Susa 20 km -> prospect pubblici -> F1 Centrale Telefonate Guidate
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows_valle_susa/run_telefonate.ps1

      - name: Verifica end-to-end server locale persistente
        shell: powershell
        run: |
          $health = 'http://127.0.0.1:8766/health'
          $home = 'http://127.0.0.1:8766/'
          $r = Invoke-WebRequest -UseBasicParsing -Uri $health -TimeoutSec 3
          if ($r.StatusCode -ne 200 -or $r.Content.Trim() -ne 'OK') { throw 'FAIL /health Centrale.' }
          $page = Invoke-WebRequest -UseBasicParsing -Uri $home -TimeoutSec 5
          if ($page.StatusCode -ne 200) { throw "FAIL pagina Centrale HTTP $($page.StatusCode)" }
          if ($page.Content -notmatch 'F1 CENTRALE TELEFONATE GUIDATE') { throw 'FAIL contenuto pagina Centrale errato.' }
          $task = Get-ScheduledTask -TaskName 'F1 Centrale Server' -ErrorAction Stop
          if ($task.Triggers.Count -lt 1) { throw 'FAIL task persistente senza trigger.' }
          Write-Host 'PASS: pagina Centrale HTTP 200, contenuto atteso, /health OK e task persistente presente.'

      - name: Stato locale centrale
        if: always()
        shell: powershell
        run: |
          $base = Join-Path $HOME 'Documents\F1_Directory_Microzone'
          $report = Join-Path $base 'F1_CENTRALE_TELEFONATE_GUIDATE.html'
          $calls = Join-Path $base 'data\centrale_telefonate_guidate.csv'
          $prospects = Join-Path $base 'data\prospect_web_susa_20km.csv'
          $micro = Join-Path $base 'data\telefonate_susa_20km.csv'
          $log = Join-Path $base 'prospect_web.log'
          if (Test-Path $report) { Write-Host "UNICO PUNTO CHIAMATE: $report" } else { Write-Error 'F1_CENTRALE_TELEFONATE_GUIDATE.html non trovata.' }
          if (Test-Path $calls) { Write-Host "CSV CENTRALE: $calls" }
          if (Test-Path $prospects) { Write-Host "PROSPECT WEB LOCALI: $prospects" }
          if (Test-Path $micro) { Write-Host "CONTATTI MICROZONE 20 KM: $micro" }
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          Write-Host 'Privacy: nessun nome, telefono, email o esito viene caricato come artifact GitHub.'
          Write-Host 'CRM: nessun prospect viene inserito automaticamente; ingresso solo dopo esito utile.'
