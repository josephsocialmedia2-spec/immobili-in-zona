name: F1 Market Intelligence CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'seller_radar_auto/market_intelligence.py'
      - 'seller_radar_auto/market_intelligence_v2.py'
      - 'seller_radar_auto/appointment_brief.py'
      - 'seller_radar_auto/merge_discovery.py'
      - 'seller_radar_auto/discovery_one.py'
      - 'seller_radar_auto/integrations.json'
      - '.github/workflows/f1-seller-radar-auto.yml'
      - '.github/workflows/f1-market-intelligence-ci.yml'
  pull_request:
    paths:
      - 'seller_radar_auto/market_intelligence.py'
      - 'seller_radar_auto/market_intelligence_v2.py'
      - 'seller_radar_auto/appointment_brief.py'
      - 'seller_radar_auto/merge_discovery.py'
      - 'seller_radar_auto/discovery_one.py'
      - 'seller_radar_auto/integrations.json'
      - '.github/workflows/f1-seller-radar-auto.yml'
      - '.github/workflows/f1-market-intelligence-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m py_compile seller_radar_auto/market_intelligence.py
          python -m py_compile seller_radar_auto/market_intelligence_v2.py
          python -m py_compile seller_radar_auto/appointment_brief.py
          python -m py_compile seller_radar_auto/merge_discovery.py
          python -m py_compile seller_radar_auto/discovery_one.py

      - name: Generate Market Intelligence and Brief from repository state
        run: |
          python seller_radar_auto/market_intelligence_v2.py
          python seller_radar_auto/appointment_brief.py

      - name: Verify expected outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f seller_radar_auto/data/intelligence/immobili_snapshot.csv
          test -f seller_radar_auto/data/intelligence/kpi_comuni.csv
          test -f seller_radar_auto/data/intelligence/kpi_vie.csv
          test -f seller_radar_auto/data/intelligence/kpi_tipologie.csv
          test -f seller_radar_auto/data/intelligence/kpi_agenzie.csv
          test -f seller_radar_auto/data/intelligence/kpi_segnali.csv
          test -f seller_radar_auto/data/intelligence/scarti_qualita.csv
          test -s seller_radar_auto/intelligence_dashboard.html
          test -s seller_radar_auto/appointment_brief.html
          grep -q 'F1 MARKET INTELLIGENCE' seller_radar_auto/intelligence_dashboard.html
          grep -q 'F1 IMMOBILIARE — BRIEF APPUNTAMENTO' seller_radar_auto/appointment_brief.html
          echo 'F1 Market Intelligence + Brief OK — CI read-only, nessun commit dati da questo workflow.'
