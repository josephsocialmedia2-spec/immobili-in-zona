<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}F1 Indirizzo Remoto{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span>F1</span> INDIRIZZO REMOTO</a>
    <nav>
      <a href="{{ url_for('dashboard') }}">HOME</a>
      <a href="{{ url_for('practices') }}">PRATICHE</a>
      <a href="{{ url_for('crm_xlsx') }}">EXCEL</a>
    </nav>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>F1 Immobiliare - Prima la fonte, poi il contatto.</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
